services:
  backend:
    build:
      context: ./backend
    container_name: django_backend
    ports:
      - "8080:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
